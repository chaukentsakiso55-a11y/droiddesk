name: Build artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle -p android-app --no-daemon :app:assembleDebug --stacktrace
      - name: Write SHA-256 checksum
        run: sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk > android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Android-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packager
        run: python -m pip install --requirement windows-app/requirements-build.txt
      - name: Run controller tests
        run: python -m unittest discover -s windows-app/tests -v
      - name: Build Windows EXE
        working-directory: windows-app
        run: pyinstaller --clean --noconfirm DroidDesk.spec
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash windows-app/dist/DroidDesk.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DroidDesk.exe" | Set-Content windows-app/dist/DroidDesk.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Windows
          path: |
            windows-app/dist/DroidDesk.exe
            windows-app/dist/DroidDesk.exe.sha256
          if-no-files-found: error
          retention-days: 14

