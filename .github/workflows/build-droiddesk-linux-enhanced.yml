name: Build DroidDesk Enhanced Linux Fixed

on:
  push:
    branches:
      - linux-enhanced-fixed
    paths:
      - "linux-enhanced-fix/**"
      - ".github/workflows/build-droiddesk-linux-enhanced.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch DroidDesk Enhanced v1.0.1
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/techjarves/DroidDesk-Enhanced.git upstream

      - name: Apply Linux-only fixes
        run: |
          python3 linux-enhanced-fix/patch_upstream.py upstream

      - name: Replace broken font assets
        run: |
          set -euxo pipefail
          FONT_DIR="upstream/app/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" -o "$FONT_DIR/JetBrainsMono-Regular.ttf"
          cp "$FONT_DIR/JetBrainsMono-Regular.ttf" "$FONT_DIR/JetBrainsMono-Bold.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Regular.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Bold.ttf"

      - name: Install Flutter dependencies
        working-directory: upstream/app
        run: flutter pub get

      - name: Static analysis
        working-directory: upstream/app
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: upstream/app
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="upstream/app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee DroidDesk-Enhanced-Linux-Fixed.sha256
          cp "$APK" DroidDesk-Enhanced-Linux-Fixed-v1.0.2.apk

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Enhanced-Linux-Fixed
          path: |
            DroidDesk-Enhanced-Linux-Fixed-v1.0.2.apk
            DroidDesk-Enhanced-Linux-Fixed.sha256
          if-no-files-found: error
          retention-days: 30
